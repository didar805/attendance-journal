<!DOCTYPE html>
<html>
<body>

<h3>Žurnallar</h3>
<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Žurnal goş</button>
<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>Admin panel</h3>
<button onclick="deleteJournal()">Žurnaly poz</button>
<button onclick="clearStudents()">Studentleri poz</button>
<button onclick="clearAll()">Hemmäni poz</button>

<hr>

<h3>Sapak güni goş</h3>
<input id="lessonDate" type="date">
<button onclick="addLesson()">Gün goş</button>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead"></tr>
</thead>
<tbody id="studentList"></tbody>
</table>

<br>
<div id="dailyStats"></div>

<script>

/* ===== KEYS ===== */
function journalKey(){
    return "journal_" + document.getElementById("journalSelect").value;
}

function lessonsKey(){
    return journalKey() + "_lessons";
}

/* ===== STORAGE ===== */
function getStudents(){
    return JSON.parse(localStorage.getItem(journalKey()) || "[]");
}

function saveStudents(list){
    localStorage.setItem(journalKey(), JSON.stringify(list));
}

function getLessons(){
    return JSON.parse(localStorage.getItem(lessonsKey()) || "[]");
}

function saveLessons(list){
    localStorage.setItem(lessonsKey(), JSON.stringify(list));
}

/* ===== JOURNAL ===== */
function addJournal(){
    const name = document.getElementById("journalName").value.trim();
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    if(!j.includes(name)) j.push(name);

    localStorage.setItem("journals", JSON.stringify(j));
    document.getElementById("journalName").value = "";

    loadJournals();
}

function loadJournals(){
    const sel = document.getElementById("journalSelect");
    sel.innerHTML = "";

    let j = JSON.parse(localStorage.getItem("journals") || "[]");

    if(j.length === 0){
        j = ["Esasy žurnal"];
        localStorage.setItem("journals", JSON.stringify(j));
    }

    j.forEach(x=>{
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        sel.appendChild(op);
    });

    loadStudents();
}

function deleteJournal(){
    const name = document.getElementById("journalSelect").value;
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    j = j.filter(x => x !== name);

    localStorage.setItem("journals", JSON.stringify(j));
    localStorage.removeItem("journal_"+name);
    localStorage.removeItem("journal_"+name+"_lessons");

    loadJournals();
}

/* ===== CLEAN ===== */
function clearStudents(){
    localStorage.removeItem(journalKey());
    loadStudents();
}

function clearAll(){
    if(confirm("Hemmäni pozmalymy?")){
        localStorage.clear();
        location.reload();
    }
}

/* ===== LESSON ADD (sapak sany bilen) ===== */
function addLesson(){
    const d = document.getElementById("lessonDate").value;
    if(!d) return;

    let count = prompt("Näçe sapak bar bu gün?");
    if(!count) return;

    count = parseInt(count);

    let lessons = getLessons();

    if(!lessons.find(x=>x.date===d)){
        lessons.push({date:d, count:count});
        saveLessons(lessons);
    }

    loadStudents();
}

/* ===== HEADER ===== */
function buildHeader(){
    const head = document.getElementById("tableHead");

    head.innerHTML =
        "<th>#</th><th>Student</th><th>Topar</th>";

    getLessons().forEach(l=>{
        const th = document.createElement("th");
        th.textContent = l.date;
        head.appendChild(th);
    });

    head.innerHTML += "<th>Dolandyryş</th>";
}

/* ===== ROW ===== */
function addRow(student,index){
    const list = document.getElementById("studentList");
    const tr = document.createElement("tr");

    tr.innerHTML =
        `<td>${index+1}</td>
         <td>${student.name}</td>
         <td>${student.group}</td>`;

    getLessons().forEach(lesson=>{
        const td = document.createElement("td");

        student.att = student.att || {};
        student.att[lesson.date] = student.att[lesson.date] || [];

        for(let i=0;i<lesson.count;i++){
            const btn = document.createElement("button");
            btn.textContent =
                student.att[lesson.date][i] ? "✔" : "✖";

            btn.onclick = ()=>{
                let s = getStudents();
                s[index].att = s[index].att || {};
                s[index].att[lesson.date] =
                    s[index].att[lesson.date] || [];

                s[index].att[lesson.date][i] =
                    !s[index].att[lesson.date][i];

                saveStudents(s);
                loadStudents();
            };

            td.appendChild(btn);
        }

        tr.appendChild(td);
    });

    const tdCtrl = document.createElement("td");
    const del = document.createElement("button");
    del.textContent="Poz";

    del.onclick=()=>{
        let s=getStudents();
        s.splice(index,1);
        saveStudents(s);
        loadStudents();
    };

    tdCtrl.appendChild(del);
    tr.appendChild(tdCtrl);

    list.appendChild(tr);
}

/* ===== ADD STUDENT ===== */
function addStudent(){
    const name = document.getElementById("name").value.trim();
    const group = document.getElementById("group").value.trim();
    if(!name || !group) return;

    let s = getStudents();
    s.push({name, group, att:{}});
    saveStudents(s);

    document.getElementById("name").value="";
    document.getElementById("group").value="";

    loadStudents();
}

/* ===== ANALYSIS ===== */
function buildDailyStats(){
    let html="<h3>Saýlanan žurnal boýunça:</h3>";

    const students=getStudents();

    getLessons().forEach(l=>{
        let yes=0,no=0,partial=0;

        students.forEach(s=>{
            if(!s.att || !s.att[l.date]) return;

            let arr=s.att[l.date];
            let attended=arr.filter(x=>x).length;

            if(attended===l.count) yes++;
            else if(attended===0) no++;
            else partial++;
        });

        html+=`<div><b>${l.date}</b> →
        Hemmesi gelen: ${yes},
        Gelmedik: ${no},
        Bölekleýin: ${partial}</div>`;
    });

    document.getElementById("dailyStats").innerHTML=html;
}

/* ===== LOAD ===== */
function loadStudents(){
    buildHeader();

    const list=document.getElementById("studentList");
    list.innerHTML="";

    const students=getStudents();
    students.forEach((s,i)=>addRow(s,i));

    document.getElementById("total").textContent=
        "Jemi: "+students.length;

    buildDailyStats();
}

loadJournals();

</script>

</body>
</html>
