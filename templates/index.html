DOCTYPE html>
<html>
<body>

<h3>Žurnallar</h3>

<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Žurnal goş</button>
<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>Admin panel</h3>
<button onclick="deleteJournal()">Žurnaly poz</button>
<button onclick="clearStudents()">Studentleri poz</button>
<button onclick="clearAll()">Hemmäni poz</button>

<hr>

<h3>Sapak güni goş</h3>
<input id="lessonDate" type="date">
<button onclick="addLesson()">Gün goş</button>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead">
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Dolandyryş</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<script>

function journalKey(){
    return "journal_" + document.getElementById("journalSelect").value;
}

function lessonsKey(){
    return journalKey() + "_lessons";
}

function getStudents(){
    return JSON.parse(localStorage.getItem(journalKey()) || "[]");
}

function saveStudents(list){
    localStorage.setItem(journalKey(), JSON.stringify(list));
}

function getLessons(){
    return JSON.parse(localStorage.getItem(lessonsKey()) || "[]");
}

function saveLessons(list){
    localStorage.setItem(lessonsKey(), JSON.stringify(list));
}

function addJournal(){
    const name = document.getElementById("journalName").value.trim();
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    if(!j.includes(name)) j.push(name);
    localStorage.setItem("journals", JSON.stringify(j));

    document.getElementById("journalName").value = "";
    loadJournals();
}

function loadJournals(){
    const sel = document.getElementById("journalSelect");
    sel.innerHTML = "";

    let j = JSON.parse(localStorage.getItem("journals") || "[]");

    j.forEach(x=>{
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        sel.appendChild(op);
    });

    loadStudents();
}

function deleteJournal(){
    const name = document.getElementById("journalSelect").value;
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    j = j.filter(x => x !== name);
    localStorage.setItem("journals", JSON.stringify(j));

    localStorage.removeItem("journal_"+name);
    localStorage.removeItem("journal_"+name+"_lessons");

    loadJournals();
}

function clearStudents(){
    localStorage.removeItem(journalKey());
    loadStudents();
}

function clearAll(){
    if(confirm("Hemmäni pozmalymy?")){
        localStorage.clear();
        location.reload();
    }
}

function addLesson(){
    const d = document.getElementById("lessonDate").value;
    if(!d) return;

    let lessons = getLessons();
    if(!lessons.includes(d)){
        lessons.push(d);
        saveLessons(lessons);
    }

    loadStudents();
}

function buildHeader(){
    const head = document.getElementById("tableHead");
    head.innerHTML = "<th>#</th><th>Student</th><th>Topar</th>";

    const lessons = getLessons();

    lessons.forEach(d=>{
        const th = document.createElement("th");
        th.textContent = d;
        head.appendChild(th);
    });

    const ctrl = document.createElement("th");
    ctrl.textContent = "Dolandyryş";
    head.appendChild(ctrl);
}

function addRow(student,index){
    const list = document.getElementById("studentList");
    const lessons = getLessons();

    const tr = document.createElement("tr");

    tr.innerHTML =
        `<td>${index+1}</td>
         <td>${student.name}</td>
         <td>${student.group}</td>`;

    lessons.forEach(date=>{
        const td = document.createElement("td");

        const yes = document.createElement("button");
        yes.textContent = "✔";

        yes.onclick = ()=>{
            let s = getStudents();
            s[index].att = s[index].att || {};
            s[index].att[date] = "yes";
            saveStudents(s);
            td.style.background = "lightgreen";
        };

        const no = document.createElement("button");
        no.textContent = "✖";

        no.onclick = ()=>{
            let s = getStudents();
            s[index].att = s[index].att || {};
            s[index].att[date] = "no";
            saveStudents(s);
            td.style.background = "salmon";
        };

        if(student.att && student.att[date]=="yes")
            td.style.background="lightgreen";
        if(student.att && student.att[date]=="no")
            td.style.background="salmon";

        td.append(yes,no);
        tr.appendChild(td);
    });

    const tdCtrl = document.createElement("td");

    const del = document.createElement("button");
    del.textContent = "Poz";

    del.onclick = ()=>{
        let s = getStudents();
        s.splice(index,1);
        saveStudents(s);
        loadStudents();
    };

    tdCtrl.appendChild(del);
    tr.appendChild(tdCtrl);

    list.appendChild(tr);
}

function addStudent(){
    const name = document.getElementById("name").value.trim();
    const group = document.getElementById("group").value.trim();
    if(!name || !group) return;

    let s = getStudents();
    s.push({name, group, att:{}});
    saveStudents(s);

    document.getElementById("name").value = "";
    document.getElementById("group").value = "";

    loadStudents();
}

function loadStudents(){
    buildHeader();

    const list = document.getElementById("studentList");
    list.innerHTML = "";

    const students = getStudents();

    students.forEach((s,i)=>addRow(s,i));

    document.getElementById("total").textContent =
        "Jemi: " + students.length;
}

loadJournals();

</script>

</body>
</html>
