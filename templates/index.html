<!DOCTYPE html>
<html>
<body>

<h2>📘 Žurnal ulgamy</h2>

<h3>Žurnallar</h3>
<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Goş</button>
<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>Admin panel</h3>
<button onclick="deleteJournal()">Žurnaly poz</button>
<button onclick="clearStudents()">Studentleri poz</button>
<button onclick="clearAll()">Hemmäni poz</button>

<hr>

<h3>📅 Sapak güni goş</h3>
<input id="lessonDate" type="date">
<button onclick="addLesson()">Gün goş</button>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead"></tr>
</thead>
<tbody id="studentList"></tbody>
</table>

<hr>

<h3>📅 Raspisaniýa</h3>
<input type="date" id="scheduleDate">
<input type="number" id="lessonCount" placeholder="Sapak sany">
<input type="number" id="lessonDuration" placeholder="Sapak dowamlylygy (minut)">
<button onclick="addSchedule()">Güni goş</button>

<div id="scheduleList"></div>

<hr>

<h3>📊 Analiz</h3>
<div id="dailyStats"></div>

<script>

/* ===== STORAGE KEYS ===== */
function journalKey(){
    return "journal_" + journalSelect.value;
}
function lessonsKey(){
    return journalKey() + "_lessons";
}

/* ===== STORAGE ===== */
function getStudents(){
    return JSON.parse(localStorage.getItem(journalKey()) || "[]");
}
function saveStudents(list){
    localStorage.setItem(journalKey(), JSON.stringify(list));
}
function getLessons(){
    return JSON.parse(localStorage.getItem(lessonsKey()) || "[]");
}
function saveLessons(list){
    localStorage.setItem(lessonsKey(), JSON.stringify(list));
}

/* ===== JOURNAL ===== */
function addJournal(){
    let name = journalName.value.trim();
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals")||"[]");
    if(!j.includes(name)) j.push(name);

    localStorage.setItem("journals", JSON.stringify(j));
    journalName.value="";
    loadJournals();
}

function loadJournals(){
    journalSelect.innerHTML="";
    let j = JSON.parse(localStorage.getItem("journals")||"[]");

    if(j.length===0){
        j=["Esasy žurnal"];
        localStorage.setItem("journals",JSON.stringify(j));
    }

    j.forEach(x=>{
        let o=document.createElement("option");
        o.value=x;
        o.textContent=x;
        journalSelect.appendChild(o);
    });

    loadStudents();
}

function deleteJournal(){
    let name=journalSelect.value;
    let j=JSON.parse(localStorage.getItem("journals")||"[]");
    j=j.filter(x=>x!==name);
    localStorage.setItem("journals",JSON.stringify(j));

    localStorage.removeItem("journal_"+name);
    localStorage.removeItem("journal_"+name+"_lessons");

    loadJournals();
}

function clearStudents(){
    localStorage.removeItem(journalKey());
    loadStudents();
}

function clearAll(){
    if(confirm("Hemmäni pozmalymy?")){
        localStorage.clear();
        location.reload();
    }
}

/* ===== LESSON ADD ===== */
function addLesson(){
    let d=lessonDate.value;
    if(!d) return;

    let count=parseInt(prompt("Näçe sapak bar?"));
    if(!count) return;

    let lessons=getLessons();

    if(!lessons.find(x=>x.date===d)){
        lessons.push({date:d,count:count});
        saveLessons(lessons);
    }

    loadStudents();
}

/* ===== HEADER ===== */
function buildHeader(){
    tableHead.innerHTML="<th>#</th><th>Student</th><th>Topar</th>";

    getLessons().forEach(l=>{
        let th=document.createElement("th");
        th.textContent=l.date;
        tableHead.appendChild(th);
    });

    tableHead.innerHTML+="<th>Dolandyryş</th>";
}

/* ===== ROW ===== */
function addRow(student,index){
    let tr=document.createElement("tr");

    tr.innerHTML=
        `<td>${index+1}</td>
         <td>${student.name}</td>
         <td>${student.group}</td>`;

    getLessons().forEach(lesson=>{
        let td=document.createElement("td");

        student.att = student.att || {};
        student.att[lesson.date] =
            student.att[lesson.date] || [];

        for(let i=0;i<lesson.count;i++){
            let btn=document.createElement("button");

            btn.textContent =
                student.att[lesson.date][i] ? "✔" : "✖";

            btn.onclick=()=>{
                let s=getStudents();
                s[index].att=s[index].att||{};
                s[index].att[lesson.date] =
                    s[index].att[lesson.date]||[];

                s[index].att[lesson.date][i] =
                    !s[index].att[lesson.date][i];

                saveStudents(s);
                loadStudents();
            };

            td.appendChild(btn);
        }

        tr.appendChild(td);
    });

    let tdCtrl=document.createElement("td");
    let del=document.createElement("button");
    del.textContent="Poz";

    del.onclick=()=>{
        let s=getStudents();
        s.splice(index,1);
        saveStudents(s);
        loadStudents();
    };

    tdCtrl.appendChild(del);
    tr.appendChild(tdCtrl);

    studentList.appendChild(tr);
}

/* ===== ADD STUDENT ===== */
function addStudent(){
    let nm=name.value.trim();
    let gr=group.value.trim();
    if(!nm||!gr) return;

    let s=getStudents();
    s.push({name:nm,group:gr,att:{}});
    saveStudents(s);

    name.value="";
    group.value="";
    loadStudents();
}

/* ===== ANALYSIS ===== */
function buildDailyStats(){
    let html="<h3>Gün boýunça analiz:</h3>";
    let students=getStudents();

    getLessons().forEach(l=>{
        let yes=0,no=0,partial=0;

        students.forEach(s=>{
            if(!s.att||!s.att[l.date]) return;

            let arr=s.att[l.date];
            let attended=arr.filter(x=>x).length;

            if(attended===l.count) yes++;
            else if(attended===0) no++;
            else partial++;
        });

        html+=`<div><b>${l.date}</b> →
        Hemmesi gelen: ${yes},
        Gelmedik: ${no},
        Bölekleýin: ${partial}</div>`;
    });

    dailyStats.innerHTML=html;
}

/* ===== RASPISANIYA ===== */
function addSchedule(){
    let d=scheduleDate.value;
    let c=parseInt(lessonCount.value);
    let dur=parseInt(lessonDuration.value);

    if(!d||!c) return;

    let sc=JSON.parse(localStorage.getItem("schedule")||"{}");
    sc[d]={count:c,duration:dur||0};
    localStorage.setItem("schedule",JSON.stringify(sc));

    let lessons=getLessons();
    let found=lessons.find(x=>x.date===d);

    if(found){
        found.count=c;
    }else{
        lessons.push({date:d,count:c});
    }

    saveLessons(lessons);

    showSchedule();
    loadStudents();
}

function showSchedule(){
    let sc=JSON.parse(localStorage.getItem("schedule")||"{}");

    let html="<b>Raspisaniýa:</b><br>";
    Object.keys(sc).forEach(d=>{
        html+=`${d} — ${sc[d].count} sapak (${sc[d].duration} min)<br>`;
    });

    scheduleList.innerHTML=html;
}

/* ===== LOAD ===== */
function loadStudents(){
    buildHeader();
    studentList.innerHTML="";

    let students=getStudents();
    students.forEach((s,i)=>addRow(s,i));

    total.textContent="Jemi: "+students.length;

    buildDailyStats();
}

loadJournals();
showSchedule();

</script>

</body>
</html>
