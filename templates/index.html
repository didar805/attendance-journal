<!DOCTYPE html>
<html>
<body>

<h3>Žurnallar</h3>

<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Žurnal goş</button>
<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>Admin panel</h3>
<button onclick="deleteJournal()">Žurnaly poz</button>
<button onclick="clearStudents()">Studentleri poz</button>
<button onclick="clearAll()">Hemmäni poz</button>

<hr>

<h3>Sapak güni goş</h3>
<input id="lessonDate" type="date">
<button onclick="addLesson()">Gün goş</button>

<hr>

<!-- ========= RASPISANIYA ========= -->
<h3>📅 Raspisaniýa düzmek</h3>

<input type="date" id="scheduleDate">
<input type="number" id="lessonCount" placeholder="Näçe sapak bar">
<button onclick="startSchedule()">Dowam et</button>

<div id="scheduleEditor"></div>
<div id="scheduleList"></div>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead">
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Dolandyryş</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<script>

/* ===== KEYS ===== */
function journalKey(){
    return "journal_" + document.getElementById("journalSelect").value;
}

function lessonsKey(){
    return journalKey() + "_lessons";
}

/* ===== STORAGE ===== */
function getStudents(){
    return JSON.parse(localStorage.getItem(journalKey()) || "[]");
}

function saveStudents(list){
    localStorage.setItem(journalKey(), JSON.stringify(list));
}

function getLessons(){
    return JSON.parse(localStorage.getItem(lessonsKey()) || "[]");
}

function saveLessons(list){
    localStorage.setItem(lessonsKey(), JSON.stringify(list));
}

/* ===== JOURNALS ===== */
function addJournal(){
    const name = journalName.value.trim();
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    if(!j.includes(name)) j.push(name);

    localStorage.setItem("journals", JSON.stringify(j));
    journalName.value = "";
    loadJournals();
}

function loadJournals(){
    journalSelect.innerHTML = "";
    let j = JSON.parse(localStorage.getItem("journals") || "[]");

    j.forEach(x=>{
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        journalSelect.appendChild(op);
    });

    loadStudents();
}

/* ===== RASPISANIYA ===== */

function startSchedule(){
    const date = scheduleDate.value;
    const count = parseInt(lessonCount.value);

    if(!date || !count) return;

    let html = "<h4>Sapaklary saýla:</h4>";

    const journals = JSON.parse(localStorage.getItem("journals") || []);

    for(let i=0;i<count;i++){
        html += `<div>Sapak ${i+1}: <select id="lessonSel_${i}">`;

        journals.forEach(j=>{
            html += `<option value="${j}">${j}</option>`;
        });

        html += "</select></div>";
    }

    html += `<button onclick="saveSchedule('${date}',${count})">
                Raspisaniýany sakla
             </button>`;

    scheduleEditor.innerHTML = html;
}

function saveSchedule(date,count){
    let sc = JSON.parse(localStorage.getItem("schedule") || "{}");

    sc[date] = [];

    for(let i=0;i<count;i++){
        sc[date].push(
            document.getElementById("lessonSel_"+i).value
        );
    }

    localStorage.setItem("schedule", JSON.stringify(sc));
    showSchedule();
}

function showSchedule(){
    let sc = JSON.parse(localStorage.getItem("schedule") || "{}");

    let html = "<h4>Raspisaniýa:</h4>";

    Object.keys(sc).forEach(d=>{
        html += `<b>${d}</b>: ` + sc[d].join(", ") + "<br>";
    });

    scheduleList.innerHTML = html;
}

/* ===== LESSONS ===== */
function addLesson(){
    const d = lessonDate.value;
    if(!d) return;

    let lessons = getLessons();
    if(!lessons.includes(d)){
        lessons.push(d);
        saveLessons(lessons);
    }

    loadStudents();
}

/* ===== TABLE ===== */
function buildHeader(){
    tableHead.innerHTML =
        "<th>#</th><th>Student</th><th>Topar</th>";

    getLessons().forEach(d=>{
        let th=document.createElement("th");
        th.textContent=d;
        tableHead.appendChild(th);
    });

    let ctrl=document.createElement("th");
    ctrl.textContent="Dolandyryş";
    tableHead.appendChild(ctrl);
}

function addRow(student,index){
    const tr=document.createElement("tr");

    tr.innerHTML=
        `<td>${index+1}</td>
         <td>${student.name}</td>
         <td>${student.group}</td>`;

    getLessons().forEach(date=>{
        const td=document.createElement("td");

        const yes=document.createElement("button");
        yes.textContent="✔";
        yes.onclick=()=>{
            let s=getStudents();
            s[index].att=s[index].att||{};
            s[index].att[date]="yes";
            saveStudents(s);
            td.style.background="lightgreen";
        };

        const no=document.createElement("button");
        no.textContent="✖";
        no.onclick=()=>{
            let s=getStudents();
            s[index].att=s[index].att||{};
            s[index].att[date]="no";
            saveStudents(s);
            td.style.background="salmon";
        };

        if(student.att && student.att[date]=="yes")
            td.style.background="lightgreen";
        if(student.att && student.att[date]=="no")
            td.style.background="salmon";

        td.append(yes,no);
        tr.appendChild(td);
    });

    const tdCtrl=document.createElement("td");
    const del=document.createElement("button");
    del.textContent="Poz";

    del.onclick=()=>{
        let s=getStudents();
        s.splice(index,1);
        saveStudents(s);
        loadStudents();
    };

    tdCtrl.appendChild(del);
    tr.appendChild(tdCtrl);

    studentList.appendChild(tr);
}

/* ===== STUDENTS ===== */
function addStudent(){
    const name=document.getElementById("name").value.trim();
    const group=document.getElementById("group").value.trim();
    if(!name || !group) return;

    let s=getStudents();
    s.push({name,group,att:{}});
    saveStudents(s);

    name.value="";
    group.value="";
    loadStudents();
}

function loadStudents(){
    buildHeader();
    studentList.innerHTML="";

    const students=getStudents();
    students.forEach((s,i)=>addRow(s,i));

    total.textContent="Jemi: "+students.length;
}

loadJournals();
showSchedule();

</script>

</body>
</html>
