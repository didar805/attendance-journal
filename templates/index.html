<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raspisaniýa</title>

<style>
body{font-family:Arial;margin:15px}

.schedule-day{
    background:#2c3e50;
    color:white;
    padding:10px;
    margin-top:15px;
    border-radius:6px;
}

.lesson-card{
    background:#f2f2f2;
    padding:10px;
    margin:6px 0;
    border-left:4px solid green;
    border-radius:6px;
}

.lesson-time{
    font-size:13px;
    color:#555;
}

.lesson-title{
    font-weight:bold;
}
</style>
</head>

<body>

<h2>📅 Raspisaniýa goş</h2>

<input type="date" id="scheduleDate"><br><br>

<input type="time" id="startTime" value="09:30"><br><br>

<input type="number" id="lessonCount"
placeholder="Näçe para bar"><br><br>

<input type="number" id="lessonDuration"
placeholder="Para dowamlylygy (min)"><br><br>

<button type="button" id="btnStart">Dowam et</button>

<hr>

<div id="scheduleEditor"></div>

<hr>

<div id="scheduleList"></div>

<script>
document.addEventListener("DOMContentLoaded", function(){

function formatDate(d){
    let p = d.split("-");
    return p[2]+"."+p[1]+"."+p[0];
}

function getWeekDay(dateStr){
    const days = [
        "Ýekşenbe","Duşenbe","Sişenbe",
        "Çarşenbe","Penşenbe","Anna","Şenbe"
    ];
    return days[new Date(dateStr).getDay()];
}

function calcLessonTime(start, duration, index){

    let [h,m] = start.split(":").map(Number);

    let breakMin = 10;
    let extraBreak = 40;

    let totalStart =
        h*60 + m +
        index*(duration + breakMin);

    if(index >= 2) totalStart += extraBreak;

    let totalEnd = totalStart + duration;

    function toTime(min){
        let hh = Math.floor(min/60);
        let mm = min % 60;
        return String(hh).padStart(2,"0")+":"+
               String(mm).padStart(2,"0");
    }

    return toTime(totalStart)+" - "+toTime(totalEnd);
}

/* start */
document.getElementById("btnStart").onclick = function(){

    let date = scheduleDate.value;
    let count = parseInt(lessonCount.value);
    let duration = parseInt(lessonDuration.value);

    if(!date || !count || !duration){
        alert("Maglumat doldur!");
        return;
    }

    let html="<h3>Paralary ýaz:</h3>";

    for(let i=0;i<count;i++){
        html += `
        Para ${i+1}:<br>
        Sapak:
        <input id="lessonName_${i}"><br>
        Mugallym:
        <input id="lessonTeacher_${i}"><br>
        Kabinet:
        <input id="lessonRoom_${i}"><br><br>`;
    }

    html += `<button type="button" id="btnSave">
        Raspisaniýany sakla
    </button>`;

    scheduleEditor.innerHTML = html;

    document.getElementById("btnSave").onclick = saveSchedule;
};

/* save */
function saveSchedule(){

    let date = scheduleDate.value;
    let duration = parseInt(lessonDuration.value);
    let count = parseInt(lessonCount.value);

    if(!date) return;

    let sc = JSON.parse(localStorage.getItem("schedule")||"{}");

    sc[date] = {
        start: startTime.value,
        duration: duration,
        lessons: []
    };

    for(let i=0;i<count;i++){

        let nameEl = document.getElementById("lessonName_"+i);
        if(!nameEl) continue;

        let name = nameEl.value.trim();
        if(!name) continue;

        let teacherEl =
            document.getElementById("lessonTeacher_"+i);
        let roomEl =
            document.getElementById("lessonRoom_"+i);

        sc[date].lessons.push({
            name,
            teacher: teacherEl?.value.trim() || "-",
            room: roomEl?.value.trim() || "-"
        });
    }

    localStorage.setItem("schedule", JSON.stringify(sc));
    showSchedule();
}

/* show */
function showSchedule(){

    let sc = JSON.parse(localStorage.getItem("schedule")||"{}");
    let html="";

    Object.keys(sc)
        .sort((a,b)=> new Date(a)-new Date(b))
        .forEach(d=>{

        let data = sc[d];
        let dayName = getWeekDay(d);

        html += `<div class="schedule-day">
                    ${dayName} — ${formatDate(d)}
                 </div>`;

        (data.lessons || []).forEach((lesson,i)=>{

            let name, teacher, room;

            if(typeof lesson === "string"){
                name = lesson;
                teacher = "-";
                room = "-";
            }else{
                name = lesson.name || "Sapak";
                teacher = lesson.teacher || "-";
                room = lesson.room || "-";
            }

            let time = calcLessonTime(
                data.start,
                data.duration,
                i
            );

            html += `
            <div class="lesson-card">
                <div class="lesson-time">${time}</div>
                <div class="lesson-title">${name}</div>
                <div>👨‍🏫 ${teacher}</div>
                <div>🏫 ${room}</div>
            </div>`;
        });
    });

    scheduleList.innerHTML = html;
}

showSchedule();

});
</script>

</body>
</html>
