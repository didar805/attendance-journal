<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raspisaniýa</title>

<style>
body{font-family:Arial;margin:15px}

.schedule-day{
    background:#2c3e50;
    color:white;
    padding:10px;
    margin-top:15px;
    border-radius:6px;
}

.schedule-day button{float:right;}

.lesson-card{
    background:#f2f2f2;
    padding:10px;
    margin:6px 0;
    border-left:4px solid green;
    border-radius:6px;
}

.lesson-card button{float:right;margin-left:5px;}

.lesson-time{font-size:13px;color:#555;}
.lesson-title{font-weight:bold;}
.journal{font-size:13px;color:#333;margin-top:5px;}

/* ===== JOURNAL MODAL ===== */
#journalModal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:white;
    overflow:auto;
    padding:15px;
    z-index:9999;
}

table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:6px;text-align:center}
th{background:#2c3e50;color:white}
td.attend{cursor:pointer;font-weight:bold}
</style>
</head>

<body>

<h2>📅 Raspisaniýa goş</h2>

<input type="date" id="scheduleDate"><br><br>
<input type="time" id="startTime" value="09:30"><br><br>
<input type="number" id="lessonCount" placeholder="Näçe para bar"><br><br>
<input type="number" id="lessonDuration" placeholder="Para dowamlylygy"><br><br>

<button id="btnStart">Dowam et</button>

<hr>
<div id="scheduleEditor"></div>
<hr>
<div id="scheduleList"></div>

<!-- ===== JOURNAL WINDOW ===== -->
<div id="journalModal">
<button onclick="closeJournal()">⬅ Yza gaýt</button>
<div id="journalContent"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const scheduleEditor = document.getElementById("scheduleEditor");
const scheduleList = document.getElementById("scheduleList");
const btnStart = document.getElementById("btnStart");

const scheduleDate = document.getElementById("scheduleDate");
const startTime = document.getElementById("startTime");
const lessonCount = document.getElementById("lessonCount");
const lessonDuration = document.getElementById("lessonDuration");

/* ===== STUDENTS ===== */
const students = [
"Балыева Б.",
"Бердиев Р.",
"Назаров Д.",
"Оразов К.",
"Оразов М.",
"Оразова Ч.",
"Реджеова Б.",
"Сапарлыева К.",
"Тораева Г.",
"Язгельдиев Б.",
"Янаров М."
];

/* ===== STORAGE ===== */
function safeSchedule(){
    try{
        let sc = JSON.parse(localStorage.getItem("schedule")||"{}");
        return sc && typeof sc==="object" ? sc : {};
    }catch{return {};}
}

function formatDate(d){
    let p=d.split("-");
    return p[2]+"."+p[1]+"."+p[0];
}

function getWeekDay(d){
    const days=[
        "Ýekşenbe","Duşenbe","Sişenbe",
        "Çarşenbe","Penşenbe","Anna","Şenbe"
    ];
    let dt=new Date(d);
    return isNaN(dt)?"":days[dt.getDay()];
}

function calcLessonTime(start,duration,index){
    if(!start||!duration) return "";

    let [h,m]=start.split(":").map(Number);
    let totalStart=h*60+m+index*(duration+10);
    if(index>=2) totalStart+=40;

    let end=totalStart+duration;

    const t=min=>{
        let hh=Math.floor(min/60);
        let mm=min%60;
        return String(hh).padStart(2,"0")+":"+
               String(mm).padStart(2,"0");
    };

    return t(totalStart)+" - "+t(end);
}

/* ===== ATTENDANCE TOGGLE ===== */
window.toggleAttend = function(td){
    if(td.innerText=="-") td.innerText="Н";
    else if(td.innerText=="Н") td.innerText="✓";
    else td.innerText="-";
};

/* ===== ADD LESSON ===== */
btnStart.onclick=function(){

    let date=scheduleDate.value;
    let count=parseInt(lessonCount.value);
    let duration=parseInt(lessonDuration.value);

    if(!date||!count||!duration){
        alert("Maglumat doldur!");
        return;
    }

    let html="<h3>Paralary ýaz:</h3>";

    for(let i=0;i<count;i++){
        html+=`
        Para ${i+1}:<br>
        Sapak:<br><input id="lessonName_${i}"><br>
        Mugallym:<br><input id="lessonTeacher_${i}"><br>
        Kabinet:<br><input id="lessonRoom_${i}"><br><br>`;
    }

    html+=`<button id="btnSave">Sakla</button>`;
    scheduleEditor.innerHTML=html;

    document.getElementById("btnSave").onclick=saveSchedule;
};

function saveSchedule(){

    let date=scheduleDate.value;
    let duration=parseInt(lessonDuration.value);
    let count=parseInt(lessonCount.value);

    let sc=safeSchedule();

    sc[date]={
        start:startTime.value,
        duration,
        lessons:[]
    };

    for(let i=0;i<count;i++){
        let name=document.getElementById("lessonName_"+i)?.value.trim();
        if(!name) continue;

        sc[date].lessons.push({
            name,
            teacher:document.getElementById("lessonTeacher_"+i)?.value||"-",
            room:document.getElementById("lessonRoom_"+i)?.value||"-"
        });
    }

    localStorage.setItem("schedule",JSON.stringify(sc));
    showSchedule();
}

/* ===== DELETE DAY ===== */
function deleteDay(date){
    if(!confirm("Güni pozmalymy?")) return;
    let sc=safeSchedule();
    delete sc[date];
    localStorage.setItem("schedule",JSON.stringify(sc));
    showSchedule();
}
window.deleteDay=deleteDay;

/* ===== DELETE LESSON ===== */
function deleteLesson(date,index){
    if(!confirm("Parany pozmalymy?")) return;

    let sc=safeSchedule();
    if(!sc[date]) return;

    sc[date].lessons.splice(index,1);
    localStorage.setItem("schedule",JSON.stringify(sc));
    showSchedule();
}
window.deleteLesson=deleteLesson;

/* ===== OPEN JOURNAL ===== */
function openJournal(date,index){

    let sc = safeSchedule();
    if(!sc[date] || !sc[date].lessons[index]) return;

    let lesson = sc[date].lessons[index];

    let rows="";
    students.forEach((s,i)=>{
        rows += `<tr>
                    <td>${i+1}</td>
                    <td style="text-align:left">${s}</td>
                    <td class="attend" onclick="toggleAttend(this)">-</td>
                 </tr>`;
    });

    document.getElementById("journalContent").innerHTML = `
        <h2>${lesson.name}</h2>
        <p>Мугаллим: ${lesson.teacher}</p>
        <p>Кабинет: ${lesson.room}</p>

        <table>
            <tr>
                <th>#</th>
                <th>ФИО обучающегося</th>
                <th>Посещение</th>
            </tr>
            ${rows}
        </table>
    `;

    document.getElementById("journalModal").style.display="block";
    history.pushState({journal:true}, "");
}
window.openJournal=openJournal;

/* ===== CLOSE JOURNAL ===== */
function closeJournal(){
    if(document.getElementById("journalModal").style.display==="block"){
        history.back();
    }
}
window.closeJournal=closeJournal;

/* ===== TELEFON YZA ===== */
window.addEventListener("popstate", function(){
    let modal=document.getElementById("journalModal");
    if(modal.style.display==="block"){
        modal.style.display="none";
    }
});

/* ===== SHOW SCHEDULE ===== */
function showSchedule(){

    let sc=safeSchedule();
    let html="";

    Object.keys(sc)
    .sort((a,b)=>new Date(a)-new Date(b))
    .forEach(d=>{

        let data=sc[d];
        if(!data) return;

        html+=`
        <div class="schedule-day">
            ${getWeekDay(d)} — ${formatDate(d)}
            <button onclick="deleteDay('${d}')">Poz</button>
        </div>`;

        (data.lessons||[]).forEach((l,i)=>{
            html+=`
            <div class="lesson-card">

                <button onclick="deleteLesson('${d}',${i})">Poz</button>
                <button onclick="openJournal('${d}',${i})">
                    Žurnal
                </button>

                <div class="lesson-time">
                    ${calcLessonTime(data.start,data.duration,i)}
                </div>

                <div class="lesson-title">${l.name}</div>
                <div>👨‍🏫 ${l.teacher}</div>
                <div>🏫 ${l.room}</div>

            </div>`;
        });
    });

    scheduleList.innerHTML=html;
}

showSchedule();

});
</script>

</body>
</html>
