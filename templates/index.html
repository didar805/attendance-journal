<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{font-family:Arial;margin:10px}

.schedule-day{
    background:#2c3e50;
    color:white;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
}

.lesson-card{
    background:#f2f2f2;
    padding:10px;
    margin:6px 0;
    border-left:4px solid green;
    border-radius:6px;
}

.lesson-time{
    font-size:13px;
    color:#555;
}

.lesson-title{
    font-weight:bold;
}
</style>

</head>
<body>

<h3>Žurnallar</h3>

<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Žurnal goş</button>
<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>📅 Raspisaniýa düzmek</h3>

<input type="date" id="scheduleDate">
<input type="number" id="lessonCount" placeholder="Näçe sapak bar">
<button onclick="startSchedule()">Dowam et</button>

<div id="scheduleEditor"></div>
<div id="scheduleList"></div>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead">
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Dolandyryş</th>
</tr>
</thead>
<tbody id="studentList"></tbody>
</table>

<script>

/* ===== JOURNAL ===== */
function journalKey(){
    return "journal_" + journalSelect.value;
}

function getStudents(){
    return JSON.parse(localStorage.getItem(journalKey()) || "[]");
}

function saveStudents(list){
    localStorage.setItem(journalKey(), JSON.stringify(list));
}

/* ===== JOURNALS ===== */
function addJournal(){
    let name = journalName.value.trim();
    if(!name) return;

    let j = JSON.parse(localStorage.getItem("journals") || "[]");
    if(!j.includes(name)) j.push(name);

    localStorage.setItem("journals", JSON.stringify(j));
    journalName.value="";
    loadJournals();
}

function loadJournals(){
    journalSelect.innerHTML="";
    let j = JSON.parse(localStorage.getItem("journals") || "[]");

    j.forEach(x=>{
        let op=document.createElement("option");
        op.value=x;
        op.textContent=x;
        journalSelect.appendChild(op);
    });

    loadStudents();
}

/* ===== RASPISANIYA ===== */
function startSchedule(){
    let date=scheduleDate.value;
    let count=parseInt(lessonCount.value);
    if(!date||!count) return;

    let html="<h4>Sapaklary saýla:</h4>";

    let journals=JSON.parse(localStorage.getItem("journals")||[]);

    for(let i=0;i<count;i++){
        html+=`Sapak ${i+1}: 
        <select id="lessonSel_${i}">`;

        journals.forEach(j=>{
            html+=`<option>${j}</option>`;
        });

        html+="</select><br>";
    }

    html+=`<button onclick="saveSchedule('${date}',${count})">
            Raspisaniýany sakla</button>`;

    scheduleEditor.innerHTML=html;
}

function saveSchedule(date,count){
    let sc=JSON.parse(localStorage.getItem("schedule")||"{}");
    sc[date]=[];

    for(let i=0;i<count;i++){
        sc[date].push(
            document.getElementById("lessonSel_"+i).value
        );
    }

    localStorage.setItem("schedule",JSON.stringify(sc));
    showSchedule();
}

/* ===== SURATDAGY YALY GÖRNIŞ ===== */
function showSchedule(){
    let sc=JSON.parse(localStorage.getItem("schedule")||"{}");

    let html="";

    Object.keys(sc).forEach(d=>{
        html+=`<div class="schedule-day">${d}</div>`;

        sc[d].forEach((lesson,i)=>{
            html+=`
            <div class="lesson-card">
                <div class="lesson-time">
                    ${i+1}-nji sapak
                </div>
                <div class="lesson-title">
                    ${lesson}
                </div>
            </div>`;
        });
    });

    scheduleList.innerHTML=html;
}

/* ===== STUDENTS ===== */
function addStudent(){
    let nm=name.value.trim();
    let gr=group.value.trim();
    if(!nm||!gr) return;

    let s=getStudents();
    s.push({name:nm,group:gr});
    saveStudents(s);

    name.value="";
    group.value="";
    loadStudents();
}

function loadStudents(){
    studentList.innerHTML="";
    let s=getStudents();

    s.forEach((st,i)=>{
        let tr=document.createElement("tr");
        tr.innerHTML=
        `<td>${i+1}</td>
         <td>${st.name}</td>
         <td>${st.group}</td>
         <td>-</td>`;
        studentList.appendChild(tr);
    });

    total.textContent="Jemi: "+s.length;
}

loadJournals();
showSchedule();

</script>

</body>
</html>
