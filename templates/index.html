<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raspisaniýa</title>

<style>
body{font-family:Arial;margin:15px}

.schedule-day{
    background:#2c3e50;
    color:white;
    padding:10px;
    margin-top:15px;
    border-radius:6px;
}

.lesson-card{
    background:#f2f2f2;
    padding:10px;
    margin:6px 0;
    border-left:4px solid green;
    border-radius:6px;
}

.lesson-time{
    font-size:13px;
    color:#555;
}

.lesson-title{
    font-weight:bold;
}
</style>

</head>
<body>

<h2>📅 Raspisaniýa goş</h2>

<input type="date" id="scheduleDate"><br><br>

<input type="time" id="startTime" value="09:00"><br><br>

<input type="number" id="lessonCount"
placeholder="Näçe para bar"><br><br>

<input type="number" id="lessonDuration"
placeholder="Para dowamlylygy (min)"><br><br>

<button onclick="startSchedule()">Dowam et</button>

<hr>

<div id="scheduleEditor"></div>

<hr>

<div id="scheduleList"></div>

<script>

/* ===== wagt hasaplaýjy ===== */
function calcLessonTime(start, duration, breakMin, index){
    let [h,m] = start.split(":").map(Number);

    let totalStart = h*60 + m +
        index*(duration + breakMin);

    let totalEnd = totalStart + duration;

    function toTime(min){
        let hh = Math.floor(min/60);
        let mm = min % 60;
        return String(hh).padStart(2,"0") + ":" +
               String(mm).padStart(2,"0");
    }

    return toTime(totalStart) +
           " - " +
           toTime(totalEnd);
}

/* ===== schedule start ===== */
function startSchedule(){
    let date = scheduleDate.value;
    let count = parseInt(lessonCount.value);
    let duration = parseInt(lessonDuration.value);

    if(!date || !count || !duration){
        alert("Maglumat doldur!");
        return;
    }

    let html="<h3>Paralary ýaz:</h3>";

    for(let i=0;i<count;i++){
        html += `
        Para ${i+1}: 
        <input id="lessonName_${i}"
        placeholder="Sapak ady"><br><br>`;
    }

    html += `
    <button onclick="saveSchedule()">
        Raspisaniýany sakla
    </button>`;

    scheduleEditor.innerHTML = html;
}

/* ===== save schedule ===== */
function saveSchedule(){
    let date = scheduleDate.value;
    let duration = parseInt(lessonDuration.value);
    let count = parseInt(lessonCount.value);

    let sc = JSON.parse(localStorage.getItem("schedule")||"{}");

    sc[date] = {
        start: startTime.value,
        duration: duration,
        lessons: []
    };

    for(let i=0;i<count;i++){
        let name =
            document.getElementById("lessonName_"+i).value || "Sapak";

        sc[date].lessons.push(name);
    }

    localStorage.setItem("schedule", JSON.stringify(sc));

    scheduleEditor.innerHTML="";
    showSchedule();
}

/* ===== show schedule ===== */
function showSchedule(){
    let sc = JSON.parse(localStorage.getItem("schedule")||"{}");

    let html="";

    Object.keys(sc).forEach(d=>{
        html += `<div class="schedule-day">${d}</div>`;

        let data = sc[d];

        data.lessons.forEach((name,i)=>{

            let time = calcLessonTime(
                data.start,
                data.duration,
                10,
                i
            );

            html += `
            <div class="lesson-card">
                <div class="lesson-time">
                    ${time}
                </div>
                <div class="lesson-title">
                    ${name}
                </div>
            </div>`;
        });
    });

    scheduleList.innerHTML = html;
}

showSchedule();

</script>

</body>
</html>
