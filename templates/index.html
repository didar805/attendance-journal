<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raspisaniýa</title>

<style>
body{font-family:Arial;margin:15px}

.schedule-day{
    background:#2c3e50;
    color:white;
    padding:10px;
    margin-top:15px;
    border-radius:6px;
}
.schedule-day button{float:right;}

.lesson-card{
    background:#f2f2f2;
    padding:10px;
    margin:6px 0;
    border-left:4px solid green;
    border-radius:6px;
}
.lesson-card button{float:right;margin-left:5px;}

.lesson-time{font-size:13px;color:#555;}
.lesson-title{font-weight:bold;}

#journalModal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:white;
    overflow:auto;
    padding:15px;
    z-index:9999;
}

table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:6px;text-align:center}
th{background:#2c3e50;color:white}
td.clickable{cursor:pointer}
</style>
</head>

<body>

<h2>📅 Raspisaniýa goş</h2>

<input type="date" id="scheduleDate"><br><br>
<input type="time" id="startTime" value="09:30"><br><br>
<input type="number" id="lessonCount" placeholder="Näçe para bar"><br><br>
<input type="number" id="lessonDuration" placeholder="Para dowamlylygy"><br><br>

<button id="btnStart">Dowam et</button>

<hr>

<!-- FILTER -->
<div>
<button onclick="setFilter('all')">Hemmesi</button>
<button onclick="setFilter('lek')">Leksiýa</button>
<button onclick="setFilter('pr')">Praktika</button>
</div>

<hr>

<div id="scheduleEditor"></div>
<hr>
<div id="scheduleList"></div>

<div id="journalModal">
<button onclick="closeJournal()">⬅ Yza gaýt</button>
<div id="journalContent"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let currentFilter="all";

/* SAPAKLAR */
const lessonList=[
"Математика",
"Менеджмент",
"Практикум по физической культуре и спорту",
"Статистика",
"Физическая культура и спорт",
"Экономика предприятия",
"Безопасность жизнедеятельности",
"Иностранный язык",
"История России"
];

const students=[
"Балыева Б.","Бердиев Р.","Назаров Д.",
"Оразов К.","Оразов М.","Оразова Ч.",
"Реджеова Б.","Сапарлыева К.",
"Тораева Г.","Язгельдиев Б.","Янаров М."
];

function safeSchedule(){
    try{return JSON.parse(localStorage.getItem("schedule")||"{}");}
    catch{return {};}
}

function saveScheduleStorage(sc){
    localStorage.setItem("schedule",JSON.stringify(sc));
}

function formatDate(d){
    let p=d.split("-");
    return p[2]+"."+p[1]+"."+p[0];
}

function getWeekDay(d){
    const days=["Ýekşenbe","Duşenbe","Sişenbe","Çarşenbe","Penşenbe","Anna","Şenbe"];
    return days[new Date(d).getDay()];
}

function calcLessonTime(start,duration,index){
    let [h,m]=start.split(":").map(Number);
    let totalStart=h*60+m+index*(duration+10);
    if(index>=2) totalStart+=40;
    let end=totalStart+duration;

    const t=min=>{
        let hh=Math.floor(min/60);
        let mm=min%60;
        return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
    };
    return t(totalStart)+" - "+t(end);
}

/* FILTER */
window.setFilter=function(type){
    currentFilter=type;
    showSchedule();
};

/* LESSON ADD */
btnStart.onclick=function(){
    let date=scheduleDate.value;
    let count=parseInt(lessonCount.value);
    let duration=parseInt(lessonDuration.value);

    if(!date||!count||!duration){
        alert("Maglumat doldur!");
        return;
    }

    let options=lessonList
        .map(l=>`<option value="${l}">${l}</option>`)
        .join("");

    let html="<h3>Paralary ýaz:</h3>";

    for(let i=0;i<count;i++){
        html+=`
        Para ${i+1}:<br>
        Sapak:<br>
        <select id="lessonName_${i}">
        <option value="">Saýla...</option>
        ${options}
        </select><br>

        Görnüş:<br>
        <select id="lessonType_${i}">
        <option value="lek">Leksiýa</option>
        <option value="pr">Praktika</option>
        </select><br>

        Mugallym:<br><input id="lessonTeacher_${i}"><br>
        Kabinet:<br><input id="lessonRoom_${i}"><br><br>`;
    }

    html+=`<button id="btnSave">Sakla</button>`;
    scheduleEditor.innerHTML=html;

    btnSave.onclick=saveSchedule;
};

function saveSchedule(){
    let date=scheduleDate.value;
    let duration=parseInt(lessonDuration.value);
    let count=parseInt(lessonCount.value);

    let sc=safeSchedule();

    sc[date]={start:startTime.value,duration,lessons:[]};

    for(let i=0;i<count;i++){
        let name=document.getElementById("lessonName_"+i)?.value.trim();
        if(!name) continue;

        sc[date].lessons.push({
            name,
            type:document.getElementById("lessonType_"+i).value,
            teacher:document.getElementById("lessonTeacher_"+i)?.value||"-",
            room:document.getElementById("lessonRoom_"+i)?.value||"-",
            journal:{}
        });
    }

    saveScheduleStorage(sc);
    showSchedule();
}

/* DELETE */
window.deleteDay=function(date){
    if(!confirm("Pozmalymy?")) return;
    let sc=safeSchedule();
    delete sc[date];
    saveScheduleStorage(sc);
    showSchedule();
};

window.deleteLesson=function(date,index){
    let sc=safeSchedule();
    sc[date].lessons.splice(index,1);
    saveScheduleStorage(sc);
    showSchedule();
};

/* JOURNAL */
window.openJournal=function(date,index){
    let sc=safeSchedule();
    let lesson=sc[date].lessons[index];

    let rows="";
    students.forEach((s,i)=>{
        let rec=lesson.journal[i]||["-","-"];

        rows+=`
        <tr>
        <td>${i+1}</td>
        <td style="text-align:left">${s}</td>
        <td>${rec[0]}</td>
        <td>${rec[1]}</td>
        </tr>`;
    });

    journalContent.innerHTML=`
    <h2>${lesson.name}</h2>
    <p>${lesson.teacher} | ${lesson.room}</p>
    <table>
    <tr><th>#</th><th>ФИО</th><th>1</th><th>2</th></tr>
    ${rows}
    </table>`;

    journalModal.style.display="block";
};

window.closeJournal=function(){
    journalModal.style.display="none";
};

/* SHOW */
function showSchedule(){
    let sc=safeSchedule();
    let html="";

    Object.keys(sc)
    .sort((a,b)=>new Date(a)-new Date(b))
    .forEach(d=>{
        let data=sc[d];

        html+=`
        <div class="schedule-day">
        ${getWeekDay(d)} — ${formatDate(d)}
        <button onclick="deleteDay('${d}')">Poz</button>
        </div>`;

        data.lessons.forEach((l,i)=>{

            if(currentFilter!=="all" && l.type!==currentFilter)
                return;

            html+=`
            <div class="lesson-card">
            <button onclick="deleteLesson('${d}',${i})">Poz</button>
            <button onclick="openJournal('${d}',${i})">Žurnal</button>

            <div class="lesson-time">
            ${calcLessonTime(data.start,data.duration,i)}
            </div>

            <div class="lesson-title">
            ${l.name} (${l.type==="lek"?"Leksiýa":"Praktika"})
            </div>

            <div>👨‍🏫 ${l.teacher}</div>
            <div>🏫 ${l.room}</div>
            </div>`;
        });
    });

    scheduleList.innerHTML=html;
}

showSchedule();

});
</script>

</body>
</html>
