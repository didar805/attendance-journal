<!DOCTYPE html>
<html>
<body>

<h3>Žurnallar</h3>

<input id="journalName" placeholder="Žurnal ady">
<button onclick="addJournal()">Žurnal goş</button>

<br><br>

<select id="journalSelect" onchange="loadStudents()"></select>

<hr>

<h3>Student goş</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="count">Geldi: 0 | Gelmedi: 0</h4>
<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr>
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Gatnaşygy</th>
<th>Dolandyryş</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<script>

function getJournalKey(){
    return "journal_" + document.getElementById("journalSelect").value;
}

function getStudents(){
    return JSON.parse(localStorage.getItem(getJournalKey()) || "[]");
}

function saveStudents(list){
    localStorage.setItem(getJournalKey(), JSON.stringify(list));
}

function addJournal(){
    const name = document.getElementById("journalName").value.trim();
    if(!name) return;

    let journals = JSON.parse(localStorage.getItem("journals")||"[]");
    journals.push(name);
    localStorage.setItem("journals", JSON.stringify(journals));

    document.getElementById("journalName").value="";
    loadJournals();
}

function loadJournals(){
    const select = document.getElementById("journalSelect");
    select.innerHTML="";

    const journals = JSON.parse(localStorage.getItem("journals")||"[]");

    journals.forEach(j=>{
        const op=document.createElement("option");
        op.value=j;
        op.textContent=j;
        select.appendChild(op);
    });

    loadStudents();
}

function renumber(){
    document.querySelectorAll("#studentList tr")
        .forEach((tr,i)=>tr.children[0].textContent=i+1);
}

function updateCount(){
    const rows=document.querySelectorAll("#studentList tr");
    let geldi=0, gelmedi=0;

    rows.forEach(tr=>{
        if(tr.style.color==="green") geldi++;
        if(tr.style.color==="red") gelmedi++;
    });

    document.getElementById("count").textContent =
        "Geldi: "+geldi+" | Gelmedi: "+gelmedi;

    document.getElementById("total").textContent =
        "Jemi: "+rows.length;
}

function addRow(name,group,status=""){
    const list=document.getElementById("studentList");
    const tr=document.createElement("tr");

    const tdNum=document.createElement("td");
    tdNum.textContent=list.children.length+1;

    const tdName=document.createElement("td");
    tdName.textContent=name;

    const tdGroup=document.createElement("td");
    tdGroup.textContent=group;

    const tdAttend=document.createElement("td");

    if(status==="yes") tr.style.color="green";
    if(status==="no") tr.style.color="red";

    const btnYes=document.createElement("button");
    btnYes.textContent="Geldi";
    btnYes.onclick=()=>{
        tr.style.color="green";
        saveStatus(name,"yes");
        updateCount();
    };

    const btnNo=document.createElement("button");
    btnNo.textContent="Gelmedi";
    btnNo.onclick=()=>{
        tr.style.color="red";
        saveStatus(name,"no");
        updateCount();
    };

    tdAttend.append(btnYes,btnNo);

    const tdCtrl=document.createElement("td");

    const btnDelete=document.createElement("button");
    btnDelete.textContent="Poz";
    btnDelete.onclick=()=>{
        tr.remove();
        removeStudent(name);
        renumber();
        updateCount();
    };

    tdCtrl.appendChild(btnDelete);

    tr.append(tdNum,tdName,tdGroup,tdAttend,tdCtrl);
    list.appendChild(tr);
}

function saveStatus(name,status){
    let students=getStudents();
    students=students.map(s=>
        s.name===name?{...s,status}:s
    );
    saveStudents(students);
}

function removeStudent(name){
    let students=getStudents()
        .filter(s=>s.name!==name);
    saveStudents(students);
}

function addStudent(){
    const name=document.getElementById("name").value.trim();
    const group=document.getElementById("group").value.trim();

    if(!name||!group) return;

    let students=getStudents();
    students.push({name,group,status:""});
    saveStudents(students);

    addRow(name,group);

    document.getElementById("name").value="";
    document.getElementById("group").value="";

    updateCount();
}

function loadStudents(){
    const list=document.getElementById("studentList");
    list.innerHTML="";

    const students=getStudents();
    students.forEach(s=>addRow(s.name,s.group,s.status));

    updateCount();
}

loadJournals();

</script>

</body>
</html>
