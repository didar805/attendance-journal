<!DOCTYPE html>
<html>
<body>

<h3>Studentler:</h3>
<h3>Student goş</h3>

<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<h4 id="count">Geldi: 0</h4>
<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr>
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Gatnaşygy</th>
<th>Dolandyryş</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<script>

async function loadStudents() {
    const res = await fetch("/api/students");
    const data = await res.json();

    const list = document.getElementById("studentList");
    list.innerHTML = "";

    // API studentler
    data.students.forEach((s, index) => {
        addRow(list, s.name, s.group, index + 1);
    });

    // Lokal goşulanlar
    const extra = JSON.parse(localStorage.getItem("extraStudents") || "[]");

    extra.forEach(s => {
        addRow(list, s.name, s.group, list.children.length + 1);
    });

    updateCount();
}

function renumber() {
    const rows = document.querySelectorAll("#studentList tr");
    rows.forEach((tr, i) => {
        tr.children[0].textContent = i + 1;
    });
}

function addRow(list, name, group, number) {
    const tr = document.createElement("tr");

    const tdNum = document.createElement("td");
    tdNum.textContent = number;

    const tdName = document.createElement("td");
    tdName.textContent = name;

    const tdGroup = document.createElement("td");
    tdGroup.textContent = group;

    // attendance
    const tdAttend = document.createElement("td");

    const savedStatus = localStorage.getItem("att_" + name);
    if (savedStatus === "yes") tr.style.color = "green";
    if (savedStatus === "no") tr.style.color = "red";

    const btnYes = document.createElement("button");
    btnYes.textContent = "Geldi";
    btnYes.onclick = () => {
        tr.style.color = "green";
        localStorage.setItem("att_" + name, "yes");
        updateCount();
    };

    const btnNo = document.createElement("button");
    btnNo.textContent = "Gelmedi";
    btnNo.onclick = () => {
        tr.style.color = "red";
        localStorage.setItem("att_" + name, "no");
        updateCount();
    };

    tdAttend.appendChild(btnYes);
    tdAttend.appendChild(btnNo);

    // dolandyryş
    const tdButtons = document.createElement("td");

    const btnDelete = document.createElement("button");
    btnDelete.textContent = "Poz";
    btnDelete.onclick = () => {
        tr.remove();

        // localStorage-dan hem poz
        let extra = JSON.parse(localStorage.getItem("extraStudents") || "[]");
        extra = extra.filter(s => s.name !== name);
        localStorage.setItem("extraStudents", JSON.stringify(extra));

        localStorage.removeItem("att_" + name);

        renumber();
        updateCount();
    };

    tdButtons.appendChild(btnDelete);

    tr.appendChild(tdNum);
    tr.appendChild(tdName);
    tr.appendChild(tdGroup);
    tr.appendChild(tdAttend);
    tr.appendChild(tdButtons);

    list.appendChild(tr);
}

function updateCount() {
    const rows = document.querySelectorAll("#studentList tr");

    let geldi = 0;
    let gelmedi = 0;

    rows.forEach(tr => {
        if (tr.style.color === "green") geldi++;
        if (tr.style.color === "red") gelmedi++;
    });

    document.getElementById("count").textContent =
        "Geldi: " + geldi + " | Gelmedi: " + gelmedi;

    document.getElementById("total").textContent =
        "Jemi: " + rows.length;
}

function addStudent() {
    const name = document.getElementById("name").value;
    const group = document.getElementById("group").value;

    if (!name || !group) return;

    const list = document.getElementById("studentList");

    addRow(list, name, group, list.children.length + 1);

    let extra = JSON.parse(localStorage.getItem("extraStudents") || "[]");
    extra.push({ name, group });
    localStorage.setItem("extraStudents", JSON.stringify(extra));

    document.getElementById("name").value = "";
    document.getElementById("group").value = "";

    updateCount();
}

loadStudents();
</script>

</body>
</html>
