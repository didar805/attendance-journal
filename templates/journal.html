<!DOCTYPE html>
<html>
<body>

<h3>Studentler:</h3>

<h3>Student goş (Admin)</h3>
<input id="name" placeholder="Ady">
<input id="group" placeholder="Topary">
<button onclick="addStudent()">Goş</button>

<br><br>

<button onclick="addDay()">Täze gün goş</button>

<br><br>

<h4 id="count">Geldi: 0</h4>
<h4 id="total">Jemi: 0</h4>

<table border="1" width="100%">
<thead>
<tr id="tableHead">
<th>#</th>
<th>Student</th>
<th>Topar</th>
<th>Dolandyryş</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<script>

let days = JSON.parse(localStorage.getItem("days") || "[]");

function renderDays() {
    const head = document.getElementById("tableHead");

    // öňki gün sütünlerini poz
    head.querySelectorAll(".daycol").forEach(e => e.remove());

    days.forEach(day => {
        const th = document.createElement("th");
        th.textContent = day;
        th.className = "daycol";
        head.appendChild(th);
    });
}

function addDay() {
    const d = prompt("Günüň ady:");
    if (!d) return;

    days.push(d);
    localStorage.setItem("days", JSON.stringify(days));
    loadStudents();
}

async function loadStudents() {
    const res = await fetch("/api/students");
    const data = await res.json();

    const list = document.getElementById("studentList");
    list.innerHTML = "";

    renderDays();

    data.students.forEach((s, index) => {
        addRow(list, s.name, s.group, index + 1);
    });

    const extra = JSON.parse(localStorage.getItem("extraStudents") || "[]");
    extra.forEach(s => {
        addRow(list, s.name, s.group, list.children.length + 1);
    });

    updateCount();
}

function renumber() {
    const rows = document.querySelectorAll("#studentList tr");
    rows.forEach((tr, i) => {
        tr.children[0].textContent = i + 1;
    });
}

function addRow(list, name, group, number) {
    const tr = document.createElement("tr");

    const tdNum = document.createElement("td");
    tdNum.textContent = number;

    const tdName = document.createElement("td");
    tdName.textContent = name;

    const tdGroup = document.createElement("td");
    tdGroup.textContent = group;

    const tdButtons = document.createElement("td");

    const btnEdit = document.createElement("button");
    btnEdit.textContent = "Edit";
    btnEdit.onclick = () => {
        const newName = prompt("Täze ad:", name);
        const newGroup = prompt("Täze topar:", group);

        if (newName) tdName.textContent = newName;
        if (newGroup) tdGroup.textContent = newGroup;
    };

    const btnDelete = document.createElement("button");
    btnDelete.textContent = "Poz";
    btnDelete.onclick = () => {
        tr.remove();
        renumber();
        updateCount();
    };

    tdButtons.appendChild(btnEdit);
    tdButtons.appendChild(btnDelete);

    tr.appendChild(tdNum);
    tr.appendChild(tdName);
    tr.appendChild(tdGroup);
    tr.appendChild(tdButtons);

    // gün attendance
    days.forEach(day => {
        const td = document.createElement("td");

        const btnYes = document.createElement("button");
        btnYes.textContent = "✔";
        btnYes.onclick = () => td.style.background = "lightgreen";

        const btnNo = document.createElement("button");
        btnNo.textContent = "✖";
        btnNo.onclick = () => td.style.background = "salmon";

        td.appendChild(btnYes);
        td.appendChild(btnNo);

        tr.appendChild(td);
    });

    list.appendChild(tr);
}

function updateCount() {
    const rows = document.querySelectorAll("#studentList tr");

    document.getElementById("total").textContent =
        "Jemi: " + rows.length;
}

function addStudent() {
    const name = document.getElementById("name").value;
    const group = document.getElementById("group").value;

    if (!name || !group) return;

    const list = document.getElementById("studentList");

    addRow(list, name, group, list.children.length + 1);

    let extra = JSON.parse(localStorage.getItem("extraStudents") || "[]");
    extra.push({ name, group });
    localStorage.setItem("extraStudents", JSON.stringify(extra));

    document.getElementById("name").value = "";
    document.getElementById("group").value = "";

    updateCount();
}

loadStudents();

</script>

</body>
</html>
